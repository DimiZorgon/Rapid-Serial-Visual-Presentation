# --- Rapide Lecture (Vite SPA) ---
# À ajouter à la fin de /etc/nginx/sites-available/static-sites
# Cloudflare tunnel : rapide-lecture.noullez.com -> http://localhost:8085
server {
    listen 8085;
    server_name rapide-lecture.noullez.com;

    root /mnt/shared_nas/rapide-lecture/dist;
    index index.html;

    # En-têtes de sécurité (équivalent Helmet, le site étant 100 % statique)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets statiques
    # (add_header dans un location annule ceux du server : on les répète)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
