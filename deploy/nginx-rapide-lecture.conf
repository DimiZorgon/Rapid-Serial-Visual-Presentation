# --- Rapide Lecture (Node.js via PM2, port 3100) ---
# À ajouter à la fin de /etc/nginx/sites-available/static-sites
# Cloudflare tunnel : rapide-lecture.noullez.com -> http://localhost:8085
server {
    listen 8085;
    server_name rapide-lecture.noullez.com;

    # EPUB / textes jusqu'à 30 Mo (limite identique côté Node)
    client_max_body_size 30M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    # Assets Vite fingerprintés : servis directement depuis le NAS, cache long
    location /assets/ {
        root /mnt/shared_nas/rapide-lecture/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare termine le HTTPS : on transmet le schéma d'origine
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
