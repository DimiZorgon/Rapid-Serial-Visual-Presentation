<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liseuse RSVP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip pour décoder les fichiers .epub en local -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Police Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0a;
            --bg-overlay: rgba(10, 10, 10, 0.97);
            --fg: #ececec;
            --muted: #666666;
            --subtle: #222222;
            --pivot: #e11d48;
        }

        [data-theme="light"] {
            --bg: #fafafa;
            --bg-overlay: rgba(250, 250, 250, 0.97);
            --fg: #171717;
            --muted: #888888;
            --subtle: #e5e5e5;
            --pivot: #e11d48;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
            overscroll-behavior: none;
            user-select: none;
        }

        .text-fg { color: var(--fg); }
        .text-muted { color: var(--muted); }
        .bg-app { background-color: var(--bg); }
        .bg-overlay { background-color: var(--bg-overlay); }

        /* Grille d'alignement optique ORP (38% depuis la gauche) */
        .rsvp-word-grid {
            display: grid;
            grid-template-columns: 38% auto 62%;
            align-items: baseline;
            width: 100%;
            white-space: nowrap;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }

        .rsvp-prefix {
            text-align: right;
            overflow: hidden;
        }

        .rsvp-pivot {
            color: var(--pivot);
            font-weight: 500;
            text-align: center;
        }

        .rsvp-suffix {
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Repères verticaux minimalistes au-dessus et en-dessous de la lettre pivot */
        .pivot-tick {
            position: absolute;
            left: 38%;
            transform: translateX(-50%);
            width: 1px;
            height: 8px;
            background-color: var(--muted);
            opacity: 0.35;
            pointer-events: none;
        }

        /* Slider ultra-fin minimaliste */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            width: 100%;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 2px;
            background: var(--subtle);
            border-radius: 1px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--fg);
            margin-top: -5px;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover,
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.35);
        }

        /* Suppression des flèches sur l'input numérique du pourcentage */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Mots cliquables dans la phrase ou la vue élargie */
        .tappable-word {
            cursor: pointer;
            border-radius: 2px;
            transition: color 0.1s ease, opacity 0.1s ease;
        }
        .tappable-word:hover {
            color: var(--fg);
        }
        .active-word-mark {
            color: var(--fg);
            text-decoration: underline;
            text-decoration-color: var(--pivot);
            text-underline-offset: 4px;
            font-weight: 500;
        }
        .active-sentence-mark {
            color: var(--fg);
        }

        /* Scrollbar discrète */
        .clean-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .clean-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .clean-scroll::-webkit-scrollbar-thumb {
            background: var(--subtle);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col justify-between">

    <!-- ================= BARRE SUPÉRIEURE MINIMALISTE ================= -->
    <header class="w-full max-w-3xl mx-auto px-5 pt-4 pb-2 flex items-center justify-between text-xs tracking-wide text-muted z-20 shrink-0">
        <div class="flex items-center gap-5">
            <button id="btnOpenLibrary" class="hover:text-fg transition py-1">
                Livres <span id="libraryCountLabel" class="font-mono text-[11px] opacity-60"></span>
            </button>
            <label for="epubFileInput" class="cursor-pointer hover:text-fg transition py-1">
                + EPUB
            </label>
            <input type="file" id="epubFileInput" accept=".epub,application/epub+zip" class="hidden">
            <button id="btnOpenToc" class="hover:text-fg transition py-1 hidden">
                Sommaire
            </button>
        </div>

        <div class="flex items-center gap-4">
            <span id="bookTitleHeader" class="truncate max-w-[140px] sm:max-w-[240px] opacity-60 hidden sm:inline"></span>
            <button id="btnToggleTheme" class="hover:text-fg transition py-1 font-mono text-[11px]" title="Changer le thème">
                Jour / Nuit
            </button>
        </div>
    </header>

    <!-- ================= ÉTAT VIDE (AUCUN LIVRE CHARGÉ) ================= -->
    <section id="emptyStateView" class="flex-1 flex flex-col items-center justify-center px-6 text-center">
        <label for="epubFileInput" class="cursor-pointer group py-12 px-8 flex flex-col items-center gap-3">
            <span class="text-sm sm:text-base text-fg font-normal group-hover:opacity-75 transition">
                Importer un fichier .epub
            </span>
            <span class="text-xs text-muted max-w-xs leading-relaxed">
                Le livre sera enregistré dans votre navigateur pour reprendre votre lecture à tout moment.
            </span>
        </label>
    </section>

    <!-- ================= ZONE DE LECTURE CENTRALE RSVP ================= -->
    <main id="readerMainView" class="hidden flex-1 flex flex-col justify-center items-center relative px-4 max-w-3xl w-full mx-auto overflow-hidden">

        <!-- Zone tactile principale (Play / Pause au clic ou au tap) -->
        <div id="rsvpStage" class="w-full py-14 sm:py-20 relative cursor-pointer flex items-center justify-center">
            <!-- Repères subtils de fixation oculaire -->
            <div class="pivot-tick top-4"></div>
            <div class="pivot-tick bottom-4"></div>

            <!-- Mot RSVP aligné sur la lettre pivot -->
            <div id="rsvpWordContainer" class="rsvp-word-grid text-4xl sm:text-6xl font-normal tracking-tight">
                <span id="rsvpPrefix" class="rsvp-prefix"></span>
                <span id="rsvpPivot" class="rsvp-pivot"></span>
                <span id="rsvpSuffix" class="rsvp-suffix"></span>
            </div>
        </div>

        <!-- Phrase actuelle (affichée sobrement en pause pour garder le contexte) -->
        <div id="pauseSentenceContainer" class="w-full max-w-xl min-h-[3.5rem] px-2 text-center transition-opacity duration-150">
            <p id="pauseSentenceText" class="text-xs sm:text-sm text-muted leading-relaxed line-clamp-3"></p>
        </div>

    </main>

    <!-- ================= PIED DE PAGE MINIMALISTE ================= -->
    <footer id="readerFooterView" class="hidden w-full max-w-3xl mx-auto px-5 pb-5 pt-2 flex flex-col gap-4 z-20 shrink-0">

        <!-- Ligne 1 : Nom du chapitre + Sélection exacte du pourcentage global -->
        <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between text-xs text-muted gap-4">
                <!-- Nom du chapitre en bas (cliquable pour ouvrir le sommaire) -->
                <button id="btnFooterChapter" class="truncate text-left hover:text-fg transition max-w-[70%]">
                    Chapitre
                </button>

                <!-- Pourcentage global cliquable + Champ de saisie exacte -->
                <div class="flex items-center shrink-0 font-mono text-xs">
                    <button id="btnPercentDisplay" title="Cliquer pour saisir un pourcentage exact"
                        class="hover:text-fg transition py-0.5 px-1">
                        0.0%
                    </button>

                    <div id="percentInputContainer" class="hidden items-center gap-1">
                        <input type="number" id="percentExactInput" min="0" max="100" step="0.1"
                            class="w-16 bg-transparent text-fg text-right font-mono text-xs border-b border-neutral-500 focus:outline-none py-0.5"
                            placeholder="0.0">
                        <span class="text-muted">%</span>
                    </div>
                </div>
            </div>

            <!-- Curseur de progression sur la totalité du livre (0% à 100%) -->
            <input type="range" id="globalProgressSlider" min="0" max="1000" step="1" value="0"
                title="Position globale dans le livre">
        </div>

        <!-- Ligne 2 : Contrôles de lecture épurés + Vitesse MPM -->
        <div class="flex items-center justify-between text-xs text-muted pt-1">

            <!-- Gauche : Navigation phrases & Lecture/Pause -->
            <div class="flex items-center gap-5 sm:gap-7">
                <button id="btnPrevSentence" class="hover:text-fg transition py-1" title="Phrase précédente (Flèche gauche)">
                    ←
                </button>
                <button id="btnPlayPause" class="text-fg font-medium tracking-wide py-1 min-w-[54px] text-left">
                    Lecture
                </button>
                <button id="btnNextSentence" class="hover:text-fg transition py-1" title="Phrase suivante (Flèche droite)">
                    →
                </button>
            </div>

            <!-- Centre : Bouton Élargissement (revoir le chapitre/paragraphe complet) -->
            <button id="btnExpandContext" class="hover:text-fg transition py-1">
                Contexte
            </button>

            <!-- Droite : Vitesse en mots par minute -->
            <div class="flex items-center gap-2.5 font-mono">
                <button id="btnWpmMinus" class="hover:text-fg transition px-1 py-1" title="Réduire la vitesse">-25</button>
                <span id="wpmDisplay" class="text-fg min-w-[64px] text-center">300 mpm</span>
                <button id="btnWpmPlus" class="hover:text-fg transition px-1 py-1" title="Augmenter la vitesse">+25</button>
            </div>

        </div>
    </footer>

    <!-- ================= VUE ÉLARGISSEMENT (TEXTE COMPLET DU CHAPITRE) ================= -->
    <div id="expandedOverlay" class="fixed inset-0 z-40 bg-overlay hidden flex-col">
        <div class="w-full max-w-2xl mx-auto px-5 py-4 flex items-center justify-between text-xs text-muted shrink-0">
            <span id="expandedChapterTitle" class="truncate max-w-[65%]">Chapitre</span>
            <div class="flex items-center gap-5">
                <button id="btnCenterActiveWord" class="hover:text-fg transition py-1">Mot actuel</button>
                <button id="btnCloseExpanded" class="text-fg font-medium py-1">Fermer</button>
            </div>
        </div>

        <div id="expandedTextContainer"
            class="flex-1 w-full max-w-2xl mx-auto px-5 py-6 overflow-y-auto clean-scroll text-muted text-sm sm:text-base leading-relaxed space-y-5 select-text">
            <!-- Paragraphes du chapitre avec mots cliquables -->
        </div>
    </div>

    <!-- ================= VUE SOMMAIRE (LISTE DES CHAPITRES) ================= -->
    <div id="tocOverlay" class="fixed inset-0 z-40 bg-overlay hidden flex-col">
        <div class="w-full max-w-xl mx-auto px-5 py-4 flex items-center justify-between text-xs text-muted shrink-0">
            <span>Sommaire</span>
            <button id="btnCloseToc" class="text-fg font-medium py-1">Fermer</button>
        </div>

        <div id="tocList" class="flex-1 w-full max-w-xl mx-auto px-5 py-4 overflow-y-auto clean-scroll space-y-3 text-sm">
            <!-- Chapitres générés dynamiquement -->
        </div>
    </div>

    <!-- ================= VUE BIBLIOTHÈQUE (LIVRES ENREGISTRÉS DANS INDEXEDDB) ================= -->
    <div id="libraryOverlay" class="fixed inset-0 z-40 bg-overlay hidden flex-col">
        <div class="w-full max-w-xl mx-auto px-5 py-4 flex items-center justify-between text-xs text-muted shrink-0">
            <span>Livres enregistrés</span>
            <div class="flex items-center gap-5">
                <label for="epubFileInput" class="cursor-pointer hover:text-fg transition py-1">+ Importer EPUB</label>
                <button id="btnCloseLibrary" class="text-fg font-medium py-1">Fermer</button>
            </div>
        </div>

        <div id="libraryList" class="flex-1 w-full max-w-xl mx-auto px-5 py-6 overflow-y-auto clean-scroll space-y-6 text-sm">
            <!-- Liste des livres sauvegardés dans IndexedDB -->
        </div>
    </div>

    <!-- ================= MESSAGE DISCRET ================= -->
    <div id="statusToast"
        class="fixed top-12 left-1/2 -translate-x-1/2 z-50 text-xs text-muted pointer-events-none opacity-0 transition-opacity duration-200">
    </div>

    <!-- ================= LOGIQUE JAVASCRIPT ================= -->
    <script>
        /**************************************************************************
         * 1. PERSISTANCE INDEXEDDB (RSVPReaderDB)
         **************************************************************************/
        const DB_NAME = "RSVPReaderDB";
        const DB_VERSION = 1;
        const STORE_BOOKS = "books";
        let dbInstance = null;

        function openBooksDatabase() {
            return new Promise((resolve, reject) => {
                if (dbInstance) return resolve(dbInstance);
                if (!window.indexedDB) return reject(new Error("IndexedDB non supporté"));

                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_BOOKS)) {
                        const store = db.createObjectStore(STORE_BOOKS, { keyPath: "id" });
                        store.createIndex("lastRead", "lastRead", { unique: false });
                    }
                };
                request.onsuccess = (e) => {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveBookToIDB(bookRecord) {
            try {
                const db = await openBooksDatabase();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_BOOKS, "readwrite");
                    tx.objectStore(STORE_BOOKS).put(bookRecord);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e.target.error);
                });
            } catch {
                return false;
            }
        }

        async function updateBookPositionInIDB(bookId, chapterIndex, wordIndex, progressPercent) {
            try {
                const db = await openBooksDatabase();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_BOOKS, "readwrite");
                    const store = tx.objectStore(STORE_BOOKS);
                    const getReq = store.get(bookId);
                    getReq.onsuccess = () => {
                        const rec = getReq.result;
                        if (rec) {
                            rec.chapterIndex = chapterIndex;
                            rec.wordIndex = wordIndex;
                            rec.progressPercent = progressPercent;
                            rec.lastRead = Date.now();
                            store.put(rec);
                        }
                    };
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch {
                return false;
            }
        }

        async function getAllBooksFromIDB() {
            try {
                const db = await openBooksDatabase();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_BOOKS, "readonly");
                    const req = tx.objectStore(STORE_BOOKS).getAll();
                    req.onsuccess = () => {
                        const list = (req.result || []).filter(b => !b.isDemo);
                        list.sort((a, b) => (b.lastRead || 0) - (a.lastRead || 0));
                        resolve(list);
                    };
                    req.onerror = () => resolve([]);
                });
            } catch {
                return [];
            }
        }

        async function deleteBookFromIDB(bookId) {
            try {
                const db = await openBooksDatabase();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_BOOKS, "readwrite");
                    tx.objectStore(STORE_BOOKS).delete(bookId);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch {
                return false;
            }
        }

        /**************************************************************************
         * 2. ÉTAT DE L'APPLICATION
         **************************************************************************/
        const state = {
            book: null,
            savedBooks: [],
            chapterIndex: 0,
            wordIndex: 0,
            isPlaying: false,
            wpm: 300,
            theme: "dark",
            timerId: null,
            lastIdbSync: 0,
            confirmDeleteId: null
        };

        /**************************************************************************
         * 3. INDEXATION GLOBALE DU LIVRE & DÉCOUPAGE TEXTUEL
         **************************************************************************/
        function compileChapter(title, rawParagraphs, globalStartOffset) {
            const words = [];
            const sentences = [];
            const paragraphs = [];

            rawParagraphs.forEach((rawPara) => {
                const cleanPara = rawPara.replace(/\s+/g, " ").trim();
                if (!cleanPara) return;

                const sentenceMatches = cleanPara.match(/[^.!?…]+(?:[.!?…]+["»”)]*|\s*$)/g) || [cleanPara];
                const paraWordIndices = [];

                sentenceMatches.forEach((rawSent) => {
                    const trimmed = rawSent.trim();
                    if (!trimmed) return;

                    const tokens = trimmed.split(/\s+/).filter(Boolean);
                    if (!tokens.length) return;

                    const sentIdx = sentences.length;
                    const startWordIdx = words.length;

                    tokens.forEach((token, idx) => {
                        const isLast = (idx === tokens.length - 1);
                        const wIdx = words.length;
                        words.push({
                            index: wIdx,
                            globalIndex: globalStartOffset + wIdx,
                            text: token,
                            sentenceIndex: sentIdx,
                            isClauseEnd: /[,;:—–]$/.test(token),
                            isSentenceEnd: isLast || /[.!?…]["»”)]*$/.test(token),
                            isParagraphEnd: false
                        });
                        paraWordIndices.push(wIdx);
                    });

                    sentences.push({
                        index: sentIdx,
                        startWordIndex: startWordIdx,
                        endWordIndex: words.length - 1
                    });
                });

                if (words.length > 0) {
                    words[words.length - 1].isParagraphEnd = true;
                }
                if (paraWordIndices.length > 0) {
                    paragraphs.push(paraWordIndices);
                }
            });

            if (words.length === 0) {
                words.push({
                    index: 0,
                    globalIndex: globalStartOffset,
                    text: "—",
                    sentenceIndex: 0,
                    isClauseEnd: false,
                    isSentenceEnd: true,
                    isParagraphEnd: true
                });
                sentences.push({ index: 0, startWordIndex: 0, endWordIndex: 0 });
                paragraphs.push([0]);
            }

            return {
                title: title || "Chapitre",
                globalStartWordIndex: globalStartOffset,
                words,
                sentences,
                paragraphs
            };
        }

        function prepareBookObject(bookData) {
            const rawChapters = bookData.rawChapters || [];
            let runningGlobalOffset = 0;

            const chapters = rawChapters.map((ch, idx) => {
                const compiled = compileChapter(
                    ch.title || `Chapitre ${idx + 1}`,
                    ch.paragraphs || [],
                    runningGlobalOffset
                );
                runningGlobalOffset += compiled.words.length;
                return compiled;
            });

            return {
                id: bookData.id,
                title: bookData.title || "Sans titre",
                author: bookData.author || "",
                rawChapters,
                chapters,
                totalWords: Math.max(1, runningGlobalOffset),
                savedChapterIndex: bookData.chapterIndex || 0,
                savedWordIndex: bookData.wordIndex || 0
            };
        }

        /**
         * Convertit la position actuelle (chapitre, mot) en index de mot global sur tout le livre.
         */
        function getCurrentGlobalWordIndex() {
            if (!state.book || !state.book.chapters.length) return 0;
            const ch = state.book.chapters[state.chapterIndex] || state.book.chapters[0];
            return ch.globalStartWordIndex + state.wordIndex;
        }

        /**
         * Calcule le pourcentage global exact (0.0 à 100.0) dans tout le livre.
         */
        function getExactGlobalPercentage() {
            if (!state.book || state.book.totalWords <= 1) return 0;
            const globalIdx = getCurrentGlobalWordIndex();
            return Math.min(100, Math.max(0, (globalIdx / (state.book.totalWords - 1)) * 100));
        }

        /**
         * Retrouve le chapitre et le mot exact correspondant à un index de mot global.
         */
        function resolvePositionFromGlobalWordIndex(targetGlobalIdx) {
            if (!state.book || !state.book.chapters.length) {
                return { chapterIndex: 0, wordIndex: 0 };
            }
            const clamped = Math.max(0, Math.min(state.book.totalWords - 1, Math.round(targetGlobalIdx)));

            for (let c = 0; c < state.book.chapters.length; c++) {
                const ch = state.book.chapters[c];
                const start = ch.globalStartWordIndex;
                const end = start + ch.words.length - 1;
                if (clamped >= start && clamped <= end) {
                    return { chapterIndex: c, wordIndex: clamped - start };
                }
            }

            const lastChIdx = state.book.chapters.length - 1;
            return {
                chapterIndex: lastChIdx,
                wordIndex: state.book.chapters[lastChIdx].words.length - 1
            };
        }

        /**
         * Positionne le lecteur exactement à un pourcentage global donné (0% à 100%).
         */
        function seekToExactPercentage(percentValue, syncIdb = true) {
            if (!state.book) return;
            const clampedPct = Math.max(0, Math.min(100, percentValue));
            const targetGlobalWord = Math.round((clampedPct / 100) * Math.max(0, state.book.totalWords - 1));
            const pos = resolvePositionFromGlobalWordIndex(targetGlobalWord);

            state.chapterIndex = pos.chapterIndex;
            state.wordIndex = pos.wordIndex;
            renderReader(true);
            saveProgress(syncIdb);
        }

        /**************************************************************************
         * 4. DÉCODEUR DE FICHIERS .EPUB (JSZIP)
         **************************************************************************/
        function resolveRelativePath(baseFilePath, relativeHref) {
            if (!relativeHref) return "";
            const cleanHref = decodeURIComponent(relativeHref.split("#")[0]);
            const baseParts = baseFilePath.split("/");
            baseParts.pop();

            for (const part of cleanHref.split("/")) {
                if (!part || part === ".") continue;
                if (part === "..") baseParts.pop();
                else baseParts.push(part);
            }
            return baseParts.join("/");
        }

        function findZipEntry(zip, targetPath) {
            if (zip.files[targetPath]) return zip.files[targetPath];
            const lower = targetPath.toLowerCase();
            for (const key of Object.keys(zip.files)) {
                if (key.toLowerCase() === lower) return zip.files[key];
            }
            return null;
        }

        async function parseEpubFile(file) {
            showStatus("Importation du livre...");
            const zip = await JSZip.loadAsync(file);

            const containerEntry = findZipEntry(zip, "META-INF/container.xml");
            if (!containerEntry) throw new Error("Fichier EPUB invalide (container.xml manquant)");

            const parser = new DOMParser();
            const containerDoc = parser.parseFromString(await containerEntry.async("string"), "application/xml");
            const rootfileEl = containerDoc.querySelector("rootfile");
            if (!rootfileEl) throw new Error("Structure OPF introuvable");

            const opfPath = rootfileEl.getAttribute("full-path");
            const opfEntry = findZipEntry(zip, opfPath);
            if (!opfEntry) throw new Error("Fichier OPF introuvable");

            const opfDoc = parser.parseFromString(await opfEntry.async("string"), "application/xml");
            const titleEl = opfDoc.querySelector("metadata > title, dc\\:title, title");
            const creatorEl = opfDoc.querySelector("metadata > creator, dc\\:creator, creator");
            const bookTitle = titleEl ? titleEl.textContent.trim() : file.name.replace(/\.epub$/i, "");
            const bookAuthor = creatorEl ? creatorEl.textContent.trim() : "";

            const manifestMap = {};
            let tocNcxId = null;
            let navItemHref = null;

            opfDoc.querySelectorAll("manifest > item").forEach(item => {
                const id = item.getAttribute("id");
                const href = item.getAttribute("href");
                const mediaType = item.getAttribute("media-type") || "";
                const properties = item.getAttribute("properties") || "";
                if (id && href) manifestMap[id] = { href, mediaType, properties };
                if (properties.includes("nav")) navItemHref = href;
                if (mediaType === "application/x-dtbncx+xml") tocNcxId = id;
            });

            const hrefToTitleMap = {};
            if (navItemHref) {
                const navPath = resolveRelativePath(opfPath, navItemHref);
                const navEntry = findZipEntry(zip, navPath);
                if (navEntry) {
                    const navDoc = parser.parseFromString(await navEntry.async("string"), "text/html");
                    navDoc.querySelectorAll("nav a[href]").forEach(a => {
                        const res = resolveRelativePath(navPath, a.getAttribute("href"));
                        const lbl = a.textContent.replace(/\s+/g, " ").trim();
                        if (res && lbl && !hrefToTitleMap[res]) hrefToTitleMap[res] = lbl;
                    });
                }
            }

            if (tocNcxId && manifestMap[tocNcxId]) {
                const ncxPath = resolveRelativePath(opfPath, manifestMap[tocNcxId].href);
                const ncxEntry = findZipEntry(zip, ncxPath);
                if (ncxEntry) {
                    const ncxDoc = parser.parseFromString(await ncxEntry.async("string"), "application/xml");
                    ncxDoc.querySelectorAll("navPoint").forEach(np => {
                        const lblEl = np.querySelector("navLabel > text");
                        const cntEl = np.querySelector("content");
                        if (lblEl && cntEl) {
                            const res = resolveRelativePath(ncxPath, cntEl.getAttribute("src"));
                            const lbl = lblEl.textContent.replace(/\s+/g, " ").trim();
                            if (res && lbl && !hrefToTitleMap[res]) hrefToTitleMap[res] = lbl;
                        }
                    });
                }
            }

            const spineItems = Array.from(opfDoc.querySelectorAll("spine > itemref"));
            const rawChapters = [];

            for (let i = 0; i < spineItems.length; i++) {
                const idref = spineItems[i].getAttribute("idref");
                const item = manifestMap[idref];
                if (!item) continue;

                const fullPath = resolveRelativePath(opfPath, item.href);
                const entry = findZipEntry(zip, fullPath);
                if (!entry) continue;

                const htmlDoc = parser.parseFromString(await entry.async("string"), "text/html");
                htmlDoc.querySelectorAll("script, style, svg, nav, noscript").forEach(el => el.remove());

                let chapterTitle = hrefToTitleMap[fullPath];
                if (!chapterTitle) {
                    const hEl = htmlDoc.querySelector("h1, h2, h3, title");
                    if (hEl && hEl.textContent.trim().length > 1) {
                        chapterTitle = hEl.textContent.replace(/\s+/g, " ").trim();
                    }
                }

                const blocks = htmlDoc.querySelectorAll("h1, h2, h3, h4, p, blockquote, li");
                const paragraphs = [];

                if (blocks.length > 0) {
                    blocks.forEach(el => {
                        const txt = el.textContent.replace(/\s+/g, " ").trim();
                        if (txt) paragraphs.push(txt);
                    });
                } else if (htmlDoc.body) {
                    const txt = htmlDoc.body.textContent.replace(/\s+/g, " ").trim();
                    if (txt) paragraphs.push(txt);
                }

                const wordCount = paragraphs.join(" ").split(/\s+/).filter(Boolean).length;
                if (wordCount >= 3) {
                    rawChapters.push({
                        title: chapterTitle || `Chapitre ${rawChapters.length + 1}`,
                        paragraphs
                    });
                }
            }

            if (!rawChapters.length) {
                throw new Error("Aucun texte lisible trouvé dans cet EPUB");
            }

            const slug = bookTitle.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            const bookId = `epub-${slug}-${file.size}`;

            return prepareBookObject({
                id: bookId,
                title: bookTitle,
                author: bookAuthor,
                rawChapters
            });
        }

        /**************************************************************************
         * 5. POINT DE RECONNAISSANCE OPTIMAL (ORP) & AFFICHAGE MINIMALISTE
         **************************************************************************/
        function getOrpIndex(word) {
            const len = word.replace(/[.,;:!?…«»"“”()[\]]/g, "").length;
            if (len <= 1) return 0;
            if (len <= 5) return 1;
            if (len <= 9) return 2;
            if (len <= 13) return 3;
            return 4;
        }

        function splitWordOrp(word) {
            if (!word) return { prefix: "", pivot: "", suffix: "" };
            const lead = /^[«"“([‘']/.test(word) ? 1 : 0;
            const idx = Math.min(word.length - 1, getOrpIndex(word) + lead);
            return {
                prefix: word.slice(0, idx),
                pivot: word.charAt(idx),
                suffix: word.slice(idx + 1)
            };
        }

        function getCurrentChapter() {
            if (!state.book || !state.book.chapters.length) return null;
            return state.book.chapters[state.chapterIndex] || state.book.chapters[0];
        }

        function updateViewVisibility() {
            const hasBook = Boolean(state.book && state.book.chapters.length > 0);
            document.getElementById("emptyStateView").classList.toggle("hidden", hasBook);
            document.getElementById("readerMainView").classList.toggle("hidden", !hasBook);
            document.getElementById("readerMainView").classList.toggle("flex", hasBook);
            document.getElementById("readerFooterView").classList.toggle("hidden", !hasBook);
            document.getElementById("readerFooterView").classList.toggle("flex", hasBook);
            document.getElementById("btnOpenToc").classList.toggle("hidden", !hasBook);
        }

        function renderReader(skipSave = false) {
            updateViewVisibility();
            const chapter = getCurrentChapter();
            if (!chapter) return;

            state.wordIndex = Math.max(0, Math.min(chapter.words.length - 1, state.wordIndex));
            const wordObj = chapter.words[state.wordIndex];
            const { prefix, pivot, suffix } = splitWordOrp(wordObj.text);

            document.getElementById("rsvpPrefix").textContent = prefix;
            document.getElementById("rsvpPivot").textContent = pivot;
            document.getElementById("rsvpSuffix").textContent = suffix;

            // Adapter la taille si le mot est très long
            const container = document.getElementById("rsvpWordContainer");
            container.className = wordObj.text.length > 15
                ? "rsvp-word-grid text-2xl sm:text-4xl font-normal tracking-tight"
                : "rsvp-word-grid text-4xl sm:text-6xl font-normal tracking-tight";

            // Infos discrètes
            document.getElementById("bookTitleHeader").textContent = state.book.title;
            document.getElementById("btnFooterChapter").textContent = chapter.title;

            // Pourcentage global (0.0% à 100.0%) & slider global
            const exactPercent = getExactGlobalPercentage();
            const formattedPercent = `${exactPercent.toFixed(1)}%`;
            document.getElementById("btnPercentDisplay").textContent = formattedPercent;
            document.getElementById("globalProgressSlider").value = Math.round(exactPercent * 10);

            // Contexte de la phrase actuelle en pause
            renderPauseSentence(chapter, wordObj);

            if (!skipSave) {
                saveProgress(false);
            }
        }

        function renderPauseSentence(chapter, currentWordObj) {
            const container = document.getElementById("pauseSentenceContainer");
            const textEl = document.getElementById("pauseSentenceText");

            if (state.isPlaying) {
                container.style.opacity = "0";
                container.style.pointerEvents = "none";
                return;
            }

            container.style.opacity = "1";
            container.style.pointerEvents = "auto";

            const sent = chapter.sentences[currentWordObj.sentenceIndex];
            if (!sent) {
                textEl.textContent = "";
                return;
            }

            const frag = document.createDocumentFragment();
            for (let i = sent.startWordIndex; i <= sent.endWordIndex; i++) {
                const w = chapter.words[i];
                const span = document.createElement("span");
                span.textContent = w.text;
                span.className = "tappable-word" + (i === state.wordIndex ? " active-word-mark" : "");
                span.addEventListener("click", (e) => {
                    e.stopPropagation();
                    state.wordIndex = i;
                    renderReader( true);
                    saveProgress(true);
                });
                frag.appendChild(span);
                if (i < sent.endWordIndex) frag.appendChild(document.createTextNode(" "));
            }

            textEl.innerHTML = "";
            textEl.appendChild(frag);
        }

        /**************************************************************************
         * 6. MOTEUR RSVP (CADENCE ET PAUSES DE PONCTUATION NATURELLES)
         **************************************************************************/
        function getDelayForWord(wordObj) {
            const baseMs = 60000 / state.wpm;
            let mult = 1.0;
            if (wordObj.isParagraphEnd) mult = 2.2;
            else if (wordObj.isSentenceEnd) mult = 1.9;
            else if (wordObj.isClauseEnd) mult = 1.4;
            else if (wordObj.text.length > 8) mult = 1.2;
            return Math.round(baseMs * mult);
        }

        function scheduleNextWord() {
            clearTimeout(state.timerId);
            if (!state.isPlaying) return;

            const chapter = getCurrentChapter();
            if (!chapter) return;

            const currentWord = chapter.words[state.wordIndex];
            const delay = getDelayForWord(currentWord);

            state.timerId = setTimeout(() => {
                if (!state.isPlaying) return;

                if (state.wordIndex + 1 < chapter.words.length) {
                    state.wordIndex++;
                    const now = Date.now();
                    const syncIdb = (now - state.lastIdbSync > 2000);
                    renderReader(true);
                    saveProgress(syncIdb);
                    if (syncIdb) state.lastIdbSync = now;
                    scheduleNextWord();
                } else if (state.chapterIndex + 1 < state.book.chapters.length) {
                    // Passage fluide au chapitre suivant
                    state.chapterIndex++;
                    state.wordIndex = 0;
                    renderReader(true);
                    saveProgress(true);
                    scheduleNextWord();
                } else {
                    pauseReading();
                    showStatus("Fin du livre");
                }
            }, delay);
        }

        function startReading() {
            if (!state.book) return;
            const chapter = getCurrentChapter();
            if (state.wordIndex >= chapter.words.length - 1 && state.chapterIndex >= state.book.chapters.length - 1) {
                state.chapterIndex = 0;
                state.wordIndex = 0;
            }
            state.isPlaying = true;
            state.lastIdbSync = Date.now();
            document.getElementById("btnPlayPause").textContent = "Pause";
            renderReader(true);
            scheduleNextWord();
        }

        function pauseReading() {
            const wasPlaying = state.isPlaying;
            state.isPlaying = false;
            clearTimeout(state.timerId);
            document.getElementById("btnPlayPause").textContent = "Lecture";
            renderReader(true);
            if (wasPlaying) saveProgress(true);
        }

        function togglePlayPause() {
            if (!state.book) return;
            if (state.isPlaying) pauseReading();
            else startReading();
        }

        /**************************************************************************
         * 7. SAISIE EXACTE DU POURCENTAGE (0.0% À 100.0%)
         **************************************************************************/
        function openExactPercentInput() {
            if (!state.book) return;
            pauseReading();

            const btn = document.getElementById("btnPercentDisplay");
            const container = document.getElementById("percentInputContainer");
            const input = document.getElementById("percentExactInput");

            btn.classList.add("hidden");
            container.classList.remove("hidden");
            container.classList.add("flex");

            input.value = getExactGlobalPercentage().toFixed(1);
            input.focus();
            input.select();
        }

        function commitExactPercentInput(applyChange = true) {
            const btn = document.getElementById("btnPercentDisplay");
            const container = document.getElementById("percentInputContainer");
            const input = document.getElementById("percentExactInput");

            if (container.classList.contains("hidden")) return;

            if (applyChange) {
                const parsed = parseFloat(String(input.value).replace(",", "."));
                if (!isNaN(parsed)) {
                    seekToExactPercentage(parsed, true);
                }
            }

            container.classList.add("hidden");
            container.classList.remove("flex");
            btn.classList.remove("hidden");
        }

        /**************************************************************************
         * 8. VUE CONTEXTE (ÉLARGISSEMENT DU CHAPITRE)
         **************************************************************************/
        function openExpandedOverlay() {
            if (!state.book) return;
            pauseReading();

            const chapter = getCurrentChapter();
            document.getElementById("expandedChapterTitle").textContent = chapter.title;

            const container = document.getElementById("expandedTextContainer");
            container.innerHTML = "";

            const activeSentIdx = chapter.words[state.wordIndex]?.sentenceIndex ?? -1;
            const frag = document.createDocumentFragment();

            chapter.paragraphs.forEach((wordIndices) => {
                const p = document.createElement("p");
                wordIndices.forEach((wIdx, pos) => {
                    const w = chapter.words[wIdx];
                    const span = document.createElement("span");
                    span.textContent = w.text;

                    let cls = "tappable-word";
                    if (w.sentenceIndex === activeSentIdx) cls += " active-sentence-mark";
                    if (wIdx === state.wordIndex) {
                        cls += " active-word-mark";
                        span.id = "activeExpandedWord";
                    }
                    span.className = cls;

                    span.addEventListener("click", () => {
                        state.wordIndex = wIdx;
                        renderReader(true);
                        saveProgress(true);
                        closeExpandedOverlay();
                    });

                    p.appendChild(span);
                    if (pos < wordIndices.length - 1) p.appendChild(document.createTextNode(" "));
                });
                frag.appendChild(p);
            });

            container.appendChild(frag);
            const overlay = document.getElementById("expandedOverlay");
            overlay.classList.remove("hidden");
            overlay.classList.add("flex");

            setTimeout(scrollToActiveExpandedWord, 30);
        }

        function scrollToActiveExpandedWord() {
            const el = document.getElementById("activeExpandedWord");
            if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function closeExpandedOverlay() {
            const overlay = document.getElementById("expandedOverlay");
            overlay.classList.add("hidden");
            overlay.classList.remove("flex");
        }

        /**************************************************************************
         * 9. SOMMAIRE & BIBLIOTHÈQUE INDEXEDDB
         **************************************************************************/
        function openTocOverlay() {
            if (!state.book) return;
            pauseReading();

            const list = document.getElementById("tocList");
            list.innerHTML = "";

            state.book.chapters.forEach((ch, idx) => {
                const isCurrent = (idx === state.chapterIndex);
                const chapStartPct = state.book.totalWords > 1
                    ? ((ch.globalStartWordIndex / (state.book.totalWords - 1)) * 100).toFixed(1)
                    : "0.0";

                const btn = document.createElement("button");
                btn.className = `w-full text-left py-2 flex items-center justify-between gap-4 transition ${
                    isCurrent ? "text-fg font-medium" : "text-muted hover:text-fg"
                }`;
                btn.innerHTML = `
                    <span class="truncate">${ch.title}</span>
                    <span class="font-mono text-xs shrink-0 opacity-60">${chapStartPct}%</span>
                `;
                btn.addEventListener("click", () => {
                    state.chapterIndex = idx;
                    state.wordIndex = 0;
                    renderReader(true);
                    saveProgress(true);
                    closeTocOverlay();
                });
                list.appendChild(btn);
            });

            const overlay = document.getElementById("tocOverlay");
            overlay.classList.remove("hidden");
            overlay.classList.add("flex");
        }

        function closeTocOverlay() {
            const overlay = document.getElementById("tocOverlay");
            overlay.classList.add("hidden");
            overlay.classList.remove("flex");
        }

        async function refreshSavedBooks() {
            state.savedBooks = await getAllBooksFromIDB();
            const countEl = document.getElementById("libraryCountLabel");
            countEl.textContent = state.savedBooks.length > 0 ? `(${state.savedBooks.length})` : "";
            renderLibraryList();
            return state.savedBooks;
        }

        function renderLibraryList() {
            const container = document.getElementById("libraryList");
            if (!container) return;
            container.innerHTML = "";

            if (state.savedBooks.length === 0) {
                container.innerHTML = `<p class="text-muted text-xs">Aucun livre enregistré dans le navigateur.</p>`;
                return;
            }

            state.savedBooks.forEach((rec) => {
                const isCurrent = state.book && state.book.id === rec.id;
                const savedPos = getLocalPosition(rec.id, rec.chapterIndex || 0, rec.wordIndex || 0);
                const pct = isCurrent ? getExactGlobalPercentage() : (savedPos.progressPercent || rec.progressPercent || 0);

                const row = document.createElement("div");
                row.className = "flex items-center justify-between gap-4 py-2";

                const isConfirming = (state.confirmDeleteId === rec.id);

                row.innerHTML = `
                    <button class="book-open-btn text-left min-w-0 flex-1 group">
                        <div class="truncate ${isCurrent ? 'text-fg font-medium' : 'text-muted group-hover:text-fg'} transition">
                            ${rec.title}
                        </div>
                        <div class="text-xs text-muted font-mono mt-0.5">
                            ${Number(pct).toFixed(1)}% ${rec.author ? '• ' + rec.author : ''}
                        </div>
                    </button>
                    <button class="book-del-btn text-xs font-mono text-muted hover:text-fg transition shrink-0 py-1 px-2">
                        ${isConfirming ? "Confirmer ?" : "Supprimer"}
                    </button>
                `;

                row.querySelector(".book-open-btn").addEventListener("click", () => {
                    state.confirmDeleteId = null;
                    const prepared = prepareBookObject(rec);
                    loadBook(prepared);
                    closeLibraryOverlay();
                });

                row.querySelector(".book-del-btn").addEventListener("click", async (e) => {
                    e.stopPropagation();
                    if (state.confirmDeleteId !== rec.id) {
                        state.confirmDeleteId = rec.id;
                        renderLibraryList();
                        return;
                    }
                    state.confirmDeleteId = null;
                    await deleteBookFromIDB(rec.id);
                    localStorage.removeItem(`rsvp_pos_${rec.id}`);

                    const remaining = await refreshSavedBooks();
                    if (state.book && state.book.id === rec.id) {
                        if (remaining.length > 0) {
                            loadBook(prepareBookObject(remaining[0]));
                        } else {
                            state.book = null;
                            updateViewVisibility();
                        }
                    }
                });

                container.appendChild(row);
            });
        }

        function openLibraryOverlay() {
            pauseReading();
            state.confirmDeleteId = null;
            refreshSavedBooks();
            const overlay = document.getElementById("libraryOverlay");
            overlay.classList.remove("hidden");
            overlay.classList.add("flex");
        }

        function closeLibraryOverlay() {
            const overlay = document.getElementById("libraryOverlay");
            overlay.classList.add("hidden");
            overlay.classList.remove("flex");
        }

        /**************************************************************************
         * 10. SAUVEGARDE CONTINUE & PRÉFÉRENCES
         **************************************************************************/
        function saveProgress(syncIdb = false) {
            try {
                localStorage.setItem("rsvp_prefs", JSON.stringify({
                    wpm: state.wpm,
                    theme: state.theme,
                    lastBookId: state.book ? state.book.id : null
                }));

                if (!state.book) return;
                const pct = getExactGlobalPercentage();

                localStorage.setItem(`rsvp_pos_${state.book.id}`, JSON.stringify({
                    chapterIndex: state.chapterIndex,
                    wordIndex: state.wordIndex,
                    progressPercent: pct,
                    lastRead: Date.now()
                }));

                if (syncIdb) {
                    updateBookPositionInIDB(state.book.id, state.chapterIndex, state.wordIndex, pct);
                }
            } catch {}
        }

        function getLocalPosition(bookId, fallbackChap = 0, fallbackWord = 0) {
            try {
                const raw = localStorage.getItem(`rsvp_pos_${bookId}`);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        chapterIndex: typeof parsed.chapterIndex === "number" ? parsed.chapterIndex : fallbackChap,
                        wordIndex: typeof parsed.wordIndex === "number" ? parsed.wordIndex : fallbackWord,
                        progressPercent: typeof parsed.progressPercent === "number" ? parsed.progressPercent : 0
                    };
                }
            } catch {}
            return { chapterIndex: fallbackChap, wordIndex: fallbackWord, progressPercent: 0 };
        }

        function loadBook(preparedBook) {
            pauseReading();
            state.book = preparedBook;
            const pos = getLocalPosition(
                preparedBook.id,
                preparedBook.savedChapterIndex || 0,
                preparedBook.savedWordIndex || 0
            );

            state.chapterIndex = Math.max(0, Math.min(preparedBook.chapters.length - 1, pos.chapterIndex));
            const maxW = preparedBook.chapters[state.chapterIndex].words.length;
            state.wordIndex = Math.max(0, Math.min(maxW - 1, pos.wordIndex));

            renderReader(true);
            saveProgress(true);
        }

        /**************************************************************************
         * 11. NAVIGATION PHRASES, VITESSE & THÈME
         **************************************************************************/
        function prevSentence() {
            const ch = getCurrentChapter();
            if (!ch) return;
            pauseReading();

            const curWord = ch.words[state.wordIndex];
            const curSent = ch.sentences[curWord.sentenceIndex];

            if (state.wordIndex - curSent.startWordIndex > 2) {
                state.wordIndex = curSent.startWordIndex;
            } else if (curWord.sentenceIndex > 0) {
                state.wordIndex = ch.sentences[curWord.sentenceIndex - 1].startWordIndex;
            } else if (state.chapterIndex > 0) {
                state.chapterIndex--;
                const prevCh = getCurrentChapter();
                state.wordIndex = prevCh.sentences[prevCh.sentences.length - 1].startWordIndex;
            } else {
                state.wordIndex = 0;
            }

            renderReader(true);
            saveProgress(true);
        }

        function nextSentence() {
            const ch = getCurrentChapter();
            if (!ch) return;
            pauseReading();

            const curWord = ch.words[state.wordIndex];
            if (curWord.sentenceIndex + 1 < ch.sentences.length) {
                state.wordIndex = ch.sentences[curWord.sentenceIndex + 1].startWordIndex;
            } else if (state.chapterIndex + 1 < state.book.chapters.length) {
                state.chapterIndex++;
                state.wordIndex = 0;
            } else {
                state.wordIndex = ch.words.length - 1;
            }

            renderReader(true);
            saveProgress(true);
        }

        function setWpm(val) {
            state.wpm = Math.max(100, Math.min(1000, Math.round(val / 25) * 25));
            document.getElementById("wpmDisplay").textContent = `${state.wpm} mpm`;
            saveProgress(false);
        }

        function setTheme(theme) {
            state.theme = theme === "light" ? "light" : "dark";
            if (state.theme === "light") {
                document.body.setAttribute("data-theme", "light");
            } else {
                document.body.removeAttribute("data-theme");
            }
            saveProgress(false);
        }

        let toastTimer = null;
        function showStatus(msg) {
            const el = document.getElementById("statusToast");
            el.textContent = msg;
            el.style.opacity = "1";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2200);
        }

        /**************************************************************************
         * 12. ÉVÉNEMENTS & INITIALISATION
         **************************************************************************/
        function initEvents() {
            // Lecture / Pause
            document.getElementById("rsvpStage").addEventListener("click", togglePlayPause);
            document.getElementById("btnPlayPause").addEventListener("click", togglePlayPause);

            // Navigation phrases
            document.getElementById("btnPrevSentence").addEventListener("click", prevSentence);
            document.getElementById("btnNextSentence").addEventListener("click", nextSentence);

            // Vitesse MPM
            document.getElementById("btnWpmMinus").addEventListener("click", () => setWpm(state.wpm - 25));
            document.getElementById("btnWpmPlus").addEventListener("click", () => setWpm(state.wpm + 25));

            // Thème Jour / Nuit
            document.getElementById("btnToggleTheme").addEventListener("click", () => {
                setTheme(state.theme === "dark" ? "light" : "dark");
            });

            // Curseur de progression globale sur tout le livre (0.0% à 100.0%)
            const globalSlider = document.getElementById("globalProgressSlider");
            globalSlider.addEventListener("input", (e) => {
                pauseReading();
                const pct = parseInt(e.target.value, 10) / 10;
                seekToExactPercentage(pct, false);
            });
            globalSlider.addEventListener("change", () => {
                saveProgress(true);
            });

            // Saisie exacte du pourcentage
            document.getElementById("btnPercentDisplay").addEventListener("click", openExactPercentInput);
            const pctInput = document.getElementById("percentExactInput");
            pctInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    commitExactPercentInput(true);
                } else if (e.key === "Escape") {
                    e.preventDefault();
                    commitExactPercentInput(false);
                }
            });
            pctInput.addEventListener("blur", () => commitExactPercentInput(true));

            // Contexte (Élargissement)
            document.getElementById("btnExpandContext").addEventListener("click", openExpandedOverlay);
            document.getElementById("btnCloseExpanded").addEventListener("click", closeExpandedOverlay);
            document.getElementById("btnCenterActiveWord").addEventListener("click", scrollToActiveExpandedWord);

            // Sommaire
            document.getElementById("btnOpenToc").addEventListener("click", openTocOverlay);
            document.getElementById("btnFooterChapter").addEventListener("click", openTocOverlay);
            document.getElementById("btnCloseToc").addEventListener("click", closeTocOverlay);

            // Bibliothèque
            document.getElementById("btnOpenLibrary").addEventListener("click", openLibraryOverlay);
            document.getElementById("btnCloseLibrary").addEventListener("click", closeLibraryOverlay);

            // Importation de fichier .EPUB
            document.getElementById("epubFileInput").addEventListener("change", async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                try {
                    pauseReading();
                    const parsedBook = await parseEpubFile(file);
                    const existingPos = getLocalPosition(parsedBook.id, 0, 0);

                    await saveBookToIDB({
                        id: parsedBook.id,
                        title: parsedBook.title,
                        author: parsedBook.author,
                        rawChapters: parsedBook.rawChapters,
                        totalWords: parsedBook.totalWords,
                        chapterIndex: existingPos.chapterIndex,
                        wordIndex: existingPos.wordIndex,
                        progressPercent: existingPos.progressPercent,
                        lastRead: Date.now()
                    });

                    await refreshSavedBooks();
                    loadBook(parsedBook);
                    closeLibraryOverlay();
                    showStatus("Livre enregistré");
                } catch (err) {
                    showStatus(err.message || "Erreur de lecture EPUB");
                } finally {
                    e.target.value = "";
                }
            });

            // Sauvegarde automatique en quittant l'onglet ou en verrouillant le téléphone
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "hidden") {
                    pauseReading();
                    saveProgress(true);
                }
            });
            window.addEventListener("pagehide", () => saveProgress(true));
            window.addEventListener("beforeunload", () => saveProgress(true));

            // Raccourcis clavier
            window.addEventListener("keydown", (e) => {
                if (e.target.tagName === "INPUT") return;
                if (e.code === "Space") {
                    e.preventDefault();
                    togglePlayPause();
                } else if (e.code === "ArrowLeft") {
                    e.preventDefault();
                    prevSentence();
                } else if (e.code === "ArrowRight") {
                    e.preventDefault();
                    nextSentence();
                } else if (e.code === "ArrowUp") {
                    e.preventDefault();
                    setWpm(state.wpm + 25);
                } else if (e.code === "ArrowDown") {
                    e.preventDefault();
                    setWpm(state.wpm - 25);
                } else if (e.code === "Escape") {
                    closeExpandedOverlay();
                    closeTocOverlay();
                    closeLibraryOverlay();
                }
            });
        }

        window.onload = async function () {
            initEvents();

            // Restaurer les préférences (vitesse, thème, dernier livre)
            let lastBookId = null;
            try {
                const prefs = JSON.parse(localStorage.getItem("rsvp_prefs") || "null");
                if (prefs) {
                    if (prefs.wpm) setWpm(prefs.wpm);
                    if (prefs.theme) setTheme(prefs.theme);
                    lastBookId = prefs.lastBookId;
                }
            } catch {}

            // Charger les livres EPUB enregistrés dans IndexedDB (sans aucun livre de démo)
            const savedBooks = await refreshSavedBooks();

            if (savedBooks.length > 0) {
                const targetRecord = savedBooks.find(b => b.id === lastBookId) || savedBooks[0];
                loadBook(prepareBookObject(targetRecord));
            } else {
                updateViewVisibility();
            }
        };
    </script>
</body>
</html>
